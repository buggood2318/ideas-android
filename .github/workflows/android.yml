name: 构建 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm ci

      - name: 写入预置配置（密钥只从 Secrets 取，不进仓库）
        env:
          AI_KEY: ${{ secrets.DEEPSEEK_KEY }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os
          ai_key = os.environ.get('AI_KEY', '')
          data_token = os.environ.get('DATA_TOKEN', '')
          p = {}
          if ai_key:
              p['ai'] = {'base': 'https://api.deepseek.com', 'model': 'deepseek-chat', 'key': ai_key}
          if data_token:
              p['cfg'] = {'owner': 'buggood2318', 'repo': 'ideas-data', 'branch': 'main',
                          'prefix': '我想法', 'token': data_token}
          with open('www/preconf.json', 'w', encoding='utf-8') as f:
              json.dump(p, f, ensure_ascii=False)
          print('preconf 字段:', list(p.keys()))
          EOF

      - name: 同步网页资源进 APK
        run: npx cap copy android

      - name: 下载离线语音模型（26MB，不进仓库）
        run: |
          set -e
          URL=https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-small-ctc-zh-int8-2025-04-01.tar.bz2
          curl -L --retry 3 --retry-delay 2 -o /tmp/asr.tar.bz2 "$URL"
          tar -xjf /tmp/asr.tar.bz2 -C /tmp
          SRC=/tmp/sherpa-onnx-streaming-zipformer-small-ctc-zh-int8-2025-04-01
          mkdir -p android/app/src/main/assets/asr
          cp "$SRC/model.int8.onnx" android/app/src/main/assets/asr/
          cp "$SRC/tokens.txt" android/app/src/main/assets/asr/
          cp "$SRC/test_wavs/1.wav" android/app/src/main/assets/asr/probe.wav
          ls -lh android/app/src/main/assets/asr

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 确认安卓 SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME/platforms | tail -3

      - name: 写入固定签名证书
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$GITHUB_WORKSPACE/android/app/ideavault.p12"

      - name: 编译 APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/ideavault.p12
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          # 草稿：包里有预置密钥，不能出现在公开列表里（只有仓库主人能通过 API 下载）
          draft: true
          tag_name: v1.0.${{ github.run_number }}
          name: 想法速记 v1.0.${{ github.run_number }}
          body: |
            自动构建的安卓安装包。
            下载下面的 app-debug.apk，在手机上点开安装（需允许「安装未知来源应用」）。
          files: android/app/build/outputs/apk/debug/app-debug.apk
